name: screenshots

# Real screenshots for the mytoolkit.ru page: builds the app, installs it, runs it with --demo
# and pushes the pictures to the "screens" branch. Run by hand when the look changes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag (vX.Y.Z)"
        required: true
        default: "v1.0.8"
  push:
    branches: [dev]
    paths: [".github/screens.ps1", ".github/workflows/screens.yml"]

permissions:
  contents: write

jobs:
  screens:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || 'v1.0.8' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: tk
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: krisgfx9/Wireless-Device-Battery-Monitor
          ref: ${{ inputs.tag || 'v1.0.8' }}
          path: up
          persist-credentials: false
      - name: Add auto-update
        shell: pwsh
        run: python tk/patch/apply.py up "$($env:TAG.Substring(1)).0"
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make
      - name: Build
        shell: msys2 {0}
        working-directory: up
        run: make
      - name: Installer
        shell: pwsh
        working-directory: up
        run: |
          choco install innosetup --no-progress -y
          ./installer/build-installer.ps1 -Version "$($env:TAG.Substring(1)).0"
      - name: Install
        shell: pwsh
        run: |
          $s = Get-ChildItem up/dist/WirelessBattery-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $s.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/MERGETASKS="!autostart"' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exit $($p.ExitCode)" }
      - name: Screenshots
        shell: pwsh
        run: ./tk/.github/screens.ps1
      - name: Publish to the screens branch
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path shots)) { exit 0 }
          Set-Location shots
          git init -q -b screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "screenshots $env:TAG"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screens
